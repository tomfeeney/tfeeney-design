<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>404 | Page Not Found | Tom Feeney</title>
  <meta
    name="description"
    content="The page you requested could not be found."
  />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" href="../imgs/logos/mark.svg" sizes="32x32" />
  <link href="../css/bootstrap.min.css" rel="stylesheet" />
  <link href="../css/styles.css" rel="stylesheet" />
  <link href="../css/404.css" rel="stylesheet" />
</head>
<body class="error-404-page">
  <main class="container-fluid px-0">
    <section class="error-404-section">
  <div class="error-404-bg" aria-hidden="true"></div>

  <!-- NAV -->
  <div class="error-404-nav">
    <div class="container intro-txt">
      <div class="row align-items-center g-4 intro-nav">
        <nav class="site-nav" aria-label="Primary">
          <a class="site-brand" href="https://www.tfeeney-design.com">
            <img
              src="../imgs/logos/mark.svg"
              class="img-fluid d-block"
              loading="lazy"
              alt="Tom Feeney logo"
              draggable="false"
            />
          </a>

          
        </nav>
      </div>
    </div>
  </div>

  <!-- CENTERED MESSAGE -->
  <div class="error-404-intro" aria-hidden="true">
    <div class="container intro-txt h-100">
      <div class="row justify-content-center align-items-center">
        <div class="col-lg-12 text-center">
          <small>Godzilla Attack | ゴジラ襲来</small>
          <h2 class="mb-2">404</h2>
          <p class="mb-4 middle">
            <strong>Page Destroyed | ページ破壊</strong>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- SCENE -->
  <div id="container">
    <ul id="scene" class="scene">
  <li class="layer" data-depth="0.10">
    <div class="loading loading-b"></div>
  </li>

  <li class="layer" data-depth="0.20">
    <div class="jet jet-a"></div>
  </li>

  <li class="layer" data-depth="0.30">
    <div class="jet jet-b"></div>
  </li>

  <li class="layer" data-depth="0.40">
    <div class="jet jet-c"></div>
  </li>

  <li class="layer" data-depth="0.50">
    <div class="jet jet-d"></div>
  </li>

  <!-- BACK WAVES -->
  <li class="layer" data-depth="0.30">
    <div class="wave plain depth-30"></div>
  </li>

  <li class="layer" data-depth="0.40">
    <div class="wave paint depth-40"></div>
  </li>

  <li class="layer" data-depth="0.50">
    <div class="wave tidal depth-50"></div>
  </li>

  <!-- GODZILLA IN THE MIDDLE -->
  <li class="layer" data-depth="0.60">
    <div class="godzilla facing-right"></div>
  </li>

  <!-- FRONT WAVES -->
  <li class="layer" data-depth="0.60">
    <div class="wave plain depth-60"></div>
  </li>

  <li class="layer" data-depth="0.80">
    <div class="wave paint depth-80"></div>
  </li>

  <li class="layer" data-depth="1.00">
    <div class="wave tidal depth-100"></div>
  </li>
</ul>
  </div>
</section>
  </main>

  <script src="../js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/404.js" defer></script>
</body>
</html>
